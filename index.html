<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제우스의 노트북</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="laptop"><div class="cam"></div>
<div class="screen">
  <section id="lock">
    <div class="clock">09:44</div><div class="date">10월 24일 토요일</div>
    <div class="avatar">Z</div><div class="uname">제우스</div>
    <form id="pwForm"><input id="pw" type="password" placeholder="비밀번호" autocomplete="off" autofocus><button aria-label="잠금 해제">→</button></form>
    <div class="hint" id="hint">비밀번호를 입력해 잠금을 해제하세요</div>
    <div class="lt">🌐︎ 🔋︎</div>
  </section>
  <section id="desk" hidden>
    <div class="icons">
      <button class="ic" data-open="trash"><i style="background:#4a5058">🗑</i>휴지통</button>
      <button class="ic" data-open="docs"><i style="background:#d6a735">📁</i>문서</button>
      <button class="ic" data-open="dl"><i style="background:#3a8f84">⬇</i>다운로드</button>
      <button class="ic" data-open="memo"><i style="background:#5b6670">📄</i>관찰 메모.txt</button>
    </div>
    <div id="wins"></div>
    <div class="task"><div class="tc-c"><span class="win-logo"><s></s><s></s><s></s><s></s></span><span class="tb srch">🔍︎</span><span class="tb">📁</span><span class="tb">🌐</span></div><span class="tray"><span class="tg">⌃ 🌐︎ 🔊︎ 🔋︎</span><span class="tclock">09:44<br>2026-10-24</span></span></div>
  </section>
</div></div><div class="base"><div class="notch"></div></div>
<script src="app.js"></script></body></html>
